services:
  occaision:
    build:
      context: .
      dockerfile: Dockerfile
    image: occaision:latest
    container_name: occaision
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
