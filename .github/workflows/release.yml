name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (z.B. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Pytest & Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run All Checks (Lint & Test)
        run: |
          make check

  build-and-release:
    name: Build & Publish Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Release Tag & Version
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_TAG="v$(date +'%Y.%m.%d-%H%M')"
          fi
          CLEAN_VER="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "Release Tag: ${RAW_TAG} (Version: ${CLEAN_VER})"

      - name: Build Firefox Extension (dist/occaision.zip)
        run: |
          bash scripts/build_extension.sh "${{ steps.release_tag.outputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build and Export Standalone Docker Archive
        run: |
          VERSION="${{ steps.release_tag.outputs.version }}"
          docker build -t occaision:latest -t "occaision:${VERSION}" .
          mkdir -p dist
          echo "Packaging Docker image to dist/occaision-docker.tar.gz..."
          docker save occaision:latest "occaision:${VERSION}" | gzip > dist/occaision-docker.tar.gz

      - name: Build & Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/occaision.zip
            dist/occaision-docker.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
